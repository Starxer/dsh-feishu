name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: [locked, latest-harness]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Install latest Harness packages
        if: matrix.dependencies == 'latest-harness'
        shell: bash
        run: |
          dsh_version="$(npm view @deepseek-ai/dsh@latest version)"
          echo "Testing against Harness $dsh_version"
          # Drop the rc.7 lockfile and resolve everything from scratch against
          # the latest dsh-* packages. Plain `npm install --no-save` rewrites
          # node_modules from the lockfile and strips transitive peers (e.g.
          # @testing-library/dom, @deepseek-ai/dsh-scope) that the latest
          # dsh-llm / dsh-agent now need; legacy-peer-deps is also required
          # because the latest dsh-system-prompt pulls in dsh-llm@^rc.8 while
          # the devDependency set still pins rc.7. Also explicitly install
          # the runtime packages the latest dsh-agent / dsh-llm / client-ui
          # pull in (dsh-scope, dsh-timeout, @testing-library/dom) since
          # --legacy-peer-deps suppresses peer auto-install.
          rm -f package-lock.json
          npm install --no-save --legacy-peer-deps \
            "@deepseek-ai/dsh-agent@$dsh_version" \
            "@deepseek-ai/dsh-agent-default-model@$dsh_version" \
            "@deepseek-ai/dsh-agent-presets@$dsh_version" \
            "@deepseek-ai/dsh-client-ui-primitives@$dsh_version" \
            "@deepseek-ai/dsh-credentials@$dsh_version" \
            "@deepseek-ai/dsh-host-webserver@$dsh_version" \
            "@deepseek-ai/dsh-llm@$dsh_version" \
            "@deepseek-ai/dsh-scope@$dsh_version" \
            "@deepseek-ai/dsh-session@$dsh_version" \
            "@deepseek-ai/dsh-session-persistence@$dsh_version" \
            "@deepseek-ai/dsh-settings@$dsh_version" \
            "@deepseek-ai/dsh-timeout@$dsh_version" \
            "@deepseek-ai/dsh-workspace@$dsh_version" \
            "@testing-library/dom@^10.4.0"

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Inspect package contents
        run: npm pack --dry-run
