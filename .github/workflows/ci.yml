name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: [locked, latest-harness]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Install latest Harness packages
        if: matrix.dependencies == 'latest-harness'
        run: >-
          npm install --no-save --package-lock=false
          @deepseek-ai/cordis@latest
          @deepseek-ai/dsh-agent@latest
          @deepseek-ai/dsh-agent-default-model@latest
          @deepseek-ai/dsh-agent-presets@latest
          @deepseek-ai/dsh-client-ui-primitives@latest
          @deepseek-ai/dsh-credentials@latest
          @deepseek-ai/dsh-host-webserver@latest
          @deepseek-ai/dsh-llm@latest
          @deepseek-ai/dsh-session@latest
          @deepseek-ai/dsh-session-persistence@latest
          @deepseek-ai/dsh-settings@latest
          @deepseek-ai/dsh-workspace@latest

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Inspect package contents
        run: npm pack --dry-run
